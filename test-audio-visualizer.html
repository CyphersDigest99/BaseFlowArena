<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #333;
            border-radius: 10px;
            border: 1px solid #00ffff;
        }
        #mic-visualizer-canvas {
            width: 100%;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid #00ffff;
            border-radius: 6px;
            display: block;
            margin: 20px auto;
        }
        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }
        button:hover {
            background: #00cccc;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
            background: rgba(0, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎤 Audio Visualizer Test</h1>
        <p>This is a simple test for the microphone input visualizer.</p>
        
        <div class="status" id="status">
            Status: Ready to test
        </div>
        
        <canvas id="mic-visualizer-canvas" width="600" height="40"></canvas>
        
        <div>
            <button id="start-btn">Start Visualizer</button>
            <button id="stop-btn" disabled>Stop Visualizer</button>
        </div>
        
        <div style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 5px;">
            <h3>Sensitivity Controls</h3>
            <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <div>
                    <label for="sensitivity-slider">Base Sensitivity: <span id="sensitivity-value">3.0</span></label>
                    <input type="range" id="sensitivity-slider" min="1" max="8" step="0.5" value="3.0" style="width: 200px;">
                </div>
                <div>
                    <label for="power-curve-slider">Power Curve: <span id="power-curve-value">0.6</span></label>
                    <input type="range" id="power-curve-slider" min="0.3" max="1.0" step="0.1" value="0.6" style="width: 200px;">
                </div>
                <div>
                    <label>
                        <input type="checkbox" id="adaptive-checkbox" checked> Adaptive Sensitivity
                    </label>
                </div>
            </div>
        </div>
        
        <p><small>Click "Start Visualizer" and allow microphone access to see the real-time volume bar.</small></p>
    </div>

    <script type="module">
        import * as audioVisualizer from './js/audioVisualizer.js';
        
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const status = document.getElementById('status');
        const sensitivitySlider = document.getElementById('sensitivity-slider');
        const sensitivityValue = document.getElementById('sensitivity-value');
        const powerCurveSlider = document.getElementById('power-curve-slider');
        const powerCurveValue = document.getElementById('power-curve-value');
        const adaptiveCheckbox = document.getElementById('adaptive-checkbox');
        
        let microphoneStream = null;
        
        async function startVisualizer() {
            try {
                status.textContent = 'Status: Requesting microphone access...';
                startBtn.disabled = true;
                
                // Get microphone stream
                microphoneStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        sampleRate: 44100
                    } 
                });
                
                status.textContent = 'Status: Initializing visualizer...';
                
                // Start the visualizer
                const success = await audioVisualizer.initAudioVisualizer(microphoneStream);
                
                if (success) {
                    status.textContent = 'Status: Visualizer active - speak into your microphone!';
                    stopBtn.disabled = false;
                } else {
                    status.textContent = 'Status: Failed to initialize visualizer';
                    startBtn.disabled = false;
                }
                
            } catch (error) {
                console.error('Error starting visualizer:', error);
                status.textContent = `Status: Error - ${error.message}`;
                startBtn.disabled = false;
            }
        }
        
        function stopVisualizer() {
            audioVisualizer.stopAudioVisualizer();
            status.textContent = 'Status: Visualizer stopped';
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
        
        startBtn.addEventListener('click', startVisualizer);
        stopBtn.addEventListener('click', stopVisualizer);
        
        // Sensitivity control event listeners
        sensitivitySlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            sensitivityValue.textContent = value.toFixed(1);
            audioVisualizer.updateConfig({ baseSensitivity: value });
        });
        
        powerCurveSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            powerCurveValue.textContent = value.toFixed(1);
            audioVisualizer.updateConfig({ powerCurve: value });
        });
        
        adaptiveCheckbox.addEventListener('change', (e) => {
            audioVisualizer.updateConfig({ adaptiveSensitivity: e.target.checked });
        });
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            audioVisualizer.stopAudioVisualizer();
        });
    </script>
</body>
</html>
